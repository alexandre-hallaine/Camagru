<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Camagru - Authentication</title>
        <link rel="stylesheet" href="../style.css" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body class="auth-body">
        <div class="card">
            <div class="auth-logo">Camagru</div>
            <div class="nav">
                <button data-target="login" class="active">Login</button>
                <button data-target="register">Register</button>
                <button data-target="reset">Reset</button>
            </div>
            <section id="login" class="active">
                <form id="login-form">
                    <input
                        type="text"
                        id="login-username"
                        name="username"
                        placeholder="Username"
                        required
                    />
                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Password"
                        required
                    />
                    <button type="submit">Log In</button>
                </form>
            </section>
            <section id="register">
                <form id="register-form">
                    <input
                        type="email"
                        id="register-email"
                        name="email"
                        placeholder="Email"
                        required
                    />
                    <input
                        type="text"
                        id="register-username"
                        name="username"
                        placeholder="Username"
                        required
                    />
                    <input
                        type="password"
                        id="register-password"
                        name="password"
                        placeholder="Password"
                        required
                    />
                    <button type="submit">Sign Up</button>
                </form>
            </section>
            <section id="reset">
                <form id="reset-form">
                    <input
                        type="text"
                        id="reset-username"
                        name="username"
                        placeholder="Username"
                        required
                    />
                    <input
                        type="password"
                        id="reset-password"
                        name="password"
                        placeholder="New Password"
                        required
                    />
                    <button type="submit">Reset Password</button>
                </form>
            </section>
        </div>

        <script type="module" src="main.js"></script>
    </body>
</html>
